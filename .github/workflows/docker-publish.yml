name: Build and Push Redis Image

# ============================================================
# 触发条件
# ============================================================
on:
  # 监听 8.8-uos 目录下的文件变更，自动编译发布
  push:
    branches:
      - 8.8-uos
    paths:
      - '8.8-uos/**'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 8.8-uos
    paths:
      - '8.8-uos/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag'
        required: false
        default: ''
      push:
        description: 'Push to registry'
        required: false
        default: 'false'
        type: boolean

# ============================================================
# 环境变量
# ============================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REDIS_VERSION: 8.8.2
  YQ_VERSION: v4.53.6

# ============================================================
# 任务定义
# ============================================================
jobs:
  # -------------------------------------------
  # 构建任务
  # -------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # -------- 检出代码 --------
      - name: Checkout
        uses: actions/checkout@v4

      # -------- 获取架构信息 --------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -------- 配置 Docker Buildx --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------- 提取元数据（标签）--------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 主标签：目录名
            type=ref,event=branch,prefix=8.8-uos,enable=${{ github.ref == 'refs/heads/8.8-uos' }}
            # 带 Redis 版本的标签
            type=ref,event=branch,prefix=8.8-uos-${{ env.REDIS_VERSION }},enable=${{ github.ref == 'refs/heads/8.8-uos' }}
            # Tag 推送时使用 tag 名
            type=semver,pattern={{version}}
            # SHA 短提交哈希
            type=sha,prefix=,suffix=,format=short
            # 日期标签
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.event_name == 'push' }}
            # latest 标签（仅 main/master 分支）
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # -------- 登录到 GHCR --------
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------- 构建镜像 --------
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REDIS_VERSION=${{ env.REDIS_VERSION }}
            YQ_VERSION=${{ env.YQ_VERSION }}
            BASE_IMAGE_TAG=uos-server-20-1070a:latest
          platforms: |
            linux/amd64
            linux/arm64
          cache-from: type=gha,scope=${{ github.ref }}
          cache-to: type=gha,mode=max,scope=${{ github.ref }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true
          ghcr-retention-days: 30

      # -------- 导出构建摘要 --------
      - name: Image digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      # -------- 构建失败通知 --------
      - name: Failure notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue?.number || context.eventName,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Build failed! :x: Please check the workflow logs.'
            })
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------
  # 安全扫描任务
  # -------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # -------------------------------------------
  # 多平台兼容性测试
  # -------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull image for testing
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos || \
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}

      - name: Run health check
        run: |
          docker run --rm -d --name redis-test \
            -e TZ=Asia/Shanghai \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos
          sleep 5
          docker exec redis-test redis-cli ping
          docker stop redis-test

      - name: Test RedisJSON module
        run: |
          docker run --rm -d --name redis-json-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos
          sleep 5
          docker exec redis-json-test redis-cli JSON.SET test '{"hello":"world"}'
          docker exec redis-json-test redis-cli JSON.GET test
          docker stop redis-json-test

  # -------------------------------------------
  # 发布通知（仅推送 tag 时触发）
  # -------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, test, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release notes
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releaseBody = `
## Redis ${{ env.REDIS_VERSION }} for UOS 1070a

### 镜像信息
- **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
- **Tag**: ${{ github.ref_name }}
- **Digest**: \`${{ needs.build.outputs.digest }}\`
- **Platforms**: linux/amd64, linux/arm64

### 快速使用
\`\`\`bash
# 拉取镜像
docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos

# 运行容器
docker run -d --name redis \\
  -p 6379:6379 \\
  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos

# 使用自定义配置
docker run -d --name redis \\
  -v /path/to/redis.conf:/usr/local/etc/redis/redis.conf \\
  -p 6379:6379 \\
  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos \\
  redis-server /usr/local/etc/redis/redis.conf
\`\`\`

### 构建信息
- **构建时间**: ${{ github.event.head_commit.timestamp }}
- **提交**: ${{ github.sha }}
- **触发者**: ${{ github.actor }}

---
*Built with GitHub Actions*
            `;
            fs.writeFileSync('RELEASE_NOTES.md', releaseBody);
            return releaseBody;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------
  # 清理旧镜像（保留最近10个版本）
  # -------------------------------------------
  cleanup:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write

    steps:
      - name: Delete old packages
        uses: actions/github-script@v7
        with:
          script: |
            const { Octokit } = require('@octokit/rest');
            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });

            const { data: versions } = await octokit.packages.getAllPackageVersionsForPackageOwnedByOrg({
              package_type: 'container',
              package_name: 'docker-library-redis',
              org: 'blueapple168'
            });

            // 保留最近 10 个版本
            const toDelete = versions.slice(10);

            for (const version of toDelete) {
              try {
                await octokit.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: 'docker-library-redis',
                  org: 'blueapple168',
                  package_version_id: version.id
                });
                console.log(`Deleted version: ${version.name}`);
              } catch (e) {
                console.log(`Failed to delete ${version.name}: ${e.message}`);
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
