name: Build and Push Redis Image
on:
  push:
    branches:
      - 8.8-uos
    paths:
      - '8.8-uos/Dockerfile'
      - '8.8-uos/docker-entrypoint.sh'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 8.8-uos
    paths:
      - '8.8-uos/Dockerfile'
      - '8.8-uos/docker-entrypoint.sh'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry after build'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/redis-uos
  REDIS_VERSION: 8.8.2
  YQ_VERSION: v4.53.6

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.SHORT_SHA }}
      date_tag: ${{ steps.vars.outputs.DATE_TAG }}
    steps:
      - name: Set variables
        id: vars
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "DATE_TAG=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_to_registry)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: 8.8-uos
          # 支持 workflow_dispatch 控制推送；PR不推送
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_to_registry) }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos-${{ env.REDIS_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.DATE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          build-args: |
            REDIS_VERSION=${{ env.REDIS_VERSION }}
            BASE_IMAGE_TAG=uos-server-20-1070a:latest
          platforms: |
            linux/amd64
            # linux/arm64 如需aarch64打开注释
          no-cache: true
          # 移除 push-by-digest=true，否则tags不会写入镜像
          # outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: ${{ steps.vars.outputs.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- Date: ${{ steps.vars.outputs.DATE_TAG }}" >> $GITHUB_STEP_SUMMARY

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          # 使用digest，不依赖tag
          image-ref: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull image by digest
        run: |
          docker pull ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

      - name: Run health check
        run: |
          docker run --rm -d --name redis-test \
            -e TZ=Asia/Shanghai \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          sleep 5
          docker exec redis-test redis-cli ping
          docker stop redis-test || true

      - name: Test RedisJSON module
        run: |
          docker run --rm -d --name redis-json-test \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          sleep 5
          docker exec redis-json-test redis-cli JSON.SET test '{"hello":"world"}' || echo "RedisJSON not available"
          docker exec redis-json-test redis-cli PING
          docker stop redis-json-test || true

  release:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Redis ${{ env.REDIS_VERSION }} for UOS 1070a
            ### 镜像信息
            - **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            - **Tag**: ${{ github.ref_name }}
            - **Digest**: ${{ needs.build.outputs.digest }}
            - **Platforms**: linux/amd64
            ### 快速使用
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos
