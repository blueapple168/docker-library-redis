name: Build and Push Redis Image

# ============================================================
# 触发条件
# ============================================================
on:
  # 监听 8.8-uos 目录下的文件变更，自动编译发布
  push:
    branches:
      - 8.8-uos
    paths:
      - '8.8-uos/**'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 8.8-uos
    paths:
      - '8.8-uos/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry after build'
        required: false
        default: 'true'
        type: boolean

# ============================================================
# 环境变量
# ============================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/redis-uos
  REDIS_VERSION: 8.8.2
  YQ_VERSION: v4.53.6
  BASE_IMAGE: ghcr.io/blueapple168/uos-server-20-1070a:latest

# ============================================================
# 任务定义
# ============================================================
jobs:
  # -------------------------------------------
  # 构建任务
  # -------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.SHORT_SHA }}
      date_tag: ${{ steps.vars.outputs.DATE_TAG }}

    steps:
      # -------- 变量定义 --------
      - name: Set variables
        id: vars
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "DATE_TAG=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      # -------- 检出代码 --------
      - name: Checkout
        uses: actions/checkout@v4

      # -------- 获取 QEMU 支持 --------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -------- 配置 Docker Buildx --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------- 登录到 GHCR --------
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------- 构建镜像 --------
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: 8.8-uos
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            # 主标签
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos
            # 带版本号
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos-${{ env.REDIS_VERSION }}
            # SHA 标签
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.SHORT_SHA }}
            # 日期标签
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.DATE_TAG }}
            # Tag 推送时使用 tag 名
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          build-args: |
            REDIS_VERSION=${{ env.REDIS_VERSION }}
            YQ_VERSION=${{ env.YQ_VERSION }}
            BASE_IMAGE_TAG=uos-server-20-1070a:latest
          platforms: |
            linux/amd64
            linux/arm64
          cache-from: type=gha,scope=${{ github.ref }}
          cache-to: type=gha,mode=max,scope=${{ github.ref }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true
          ghcr-retention-days: 30

      # -------- 打印构建摘要 --------
      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags:" >> $GITHUB_STEP_SUMMARY
          echo "  - 8.8-uos" >> $GITHUB_STEP_SUMMARY
          echo "  - 8.8-uos-${{ env.REDIS_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "  - sha-${{ steps.vars.outputs.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ steps.vars.outputs.DATE_TAG }}" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------
  # 安全扫描任务
  # -------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image }}:8.8-uos
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # -------------------------------------------
  # 多平台兼容性测试
  # -------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull image for testing
        run: |
          docker pull ${{ needs.build.outputs.image }}:8.8-uos || \
          docker pull ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

      - name: Run health check
        run: |
          docker run --rm -d --name redis-test \
            -e TZ=Asia/Shanghai \
            ${{ needs.build.outputs.image }}:8.8-uos
          sleep 5
          docker exec redis-test redis-cli ping
          docker stop redis-test || true

      - name: Test RedisJSON module
        run: |
          docker run --rm -d --name redis-json-test \
            ${{ needs.build.outputs.image }}:8.8-uos
          sleep 5
          docker exec redis-json-test redis-cli JSON.SET test '{"hello":"world"}' || echo "RedisJSON module not loaded (expected for base image)"
          docker exec redis-json-test redis-cli PING
          docker stop redis-json-test || true

  # -------------------------------------------
  # 发布通知（仅推送 tag 时触发）
  # -------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Redis ${{ env.REDIS_VERSION }} for UOS 1070a

            ### 镜像信息
            - **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            - **Tag**: ${{ github.ref_name }}
            - **Digest**: ${{ needs.build.outputs.digest }}
            - **Platforms**: linux/amd64, linux/arm64

            ### 快速使用
            ```bash
            # 拉取镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos

            # 运行容器
            docker run -d --name redis \\
              -p 6379:6379 \\
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos

            # 使用自定义配置
            docker run -d --name redis \\
              -v /path/to/redis.conf:/usr/local/etc/redis/redis.conf \\
              -p 6379:6379 \\
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.8-uos \\
              redis-server /usr/local/etc/redis/redis.conf
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
