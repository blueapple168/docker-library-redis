name: Redis 镜像构建（UOS / Kylin V11）

# 目录约定：<major.minor>/<variant>/Dockerfile，variant ∈ {uos, kylin}
#   uos   -> 基础镜像 UOS Server 20 1070a
#   kylin -> 基础镜像 Kylin Server V11 Minimal
#
# 三个触发面：
#   push / PR       只重建仓库里已有的版本线，不自动新增目录（避免一次提交炸出 6 个镜像）
#   schedule        每周检查上游 GA 版本：自动升 patch、自动新增版本线、刷新 README，然后构建
#   workflow_dispatch 手动指定版本线 / 变体 / 强制版本号
#
# 版本范围严格跟随官方 EOL 表（config/lifecycle.json）：
#   构建「安全支持期未过期」的全部版本线（stable + LTS），已 EOL 的不再构建。

on:
  push:
    branches: [master]
    paths:
      - '*/uos/**'
      - '*/kylin/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [master]
    paths:
      - '*/uos/**'
      - '*/kylin/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/docker-publish.yml'
  schedule:
    # 每周一 06:00 UTC（北京时间 14:00）
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      lines:
        description: '只处理这些版本线（空格分隔，如 8.8 8.10；留空=按策略自动）'
        required: false
        default: ''
      variants:
        description: '只处理这些变体（空格分隔：uos kylin；留空=两个都做）'
        required: false
        default: ''
      redis_version:
        description: '强制指定 Redis 版本号（如 8.8.4；留空=取上游最新 GA）'
        required: false
        default: ''
      scaffold:
        description: '允许自动创建缺失的版本线目录'
        required: false
        default: true
        type: boolean
      push_to_registry:
        description: '构建后推送到 GHCR'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/redis
  PLATFORMS: linux/amd64

concurrency:
  group: redis-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ############################################
  # 1. 检测：解析上游版本 → 按 EOL 策略算矩阵 → 落盘改动 → 提交回 master
  ############################################
  detect:
    name: 检测上游版本与构建矩阵
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要把版本号变更与 README 更新提交回 master
    outputs:
      matrix: ${{ steps.run.outputs.matrix }}
      count: ${{ steps.run.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算构建矩阵
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          args=()
          # PR 只预演，不写文件；push 只重建已有版本线，不新增目录
          case "${{ github.event_name }}" in
            pull_request)
              args+=(--dry-run)
              echo "PR 模式：dry-run，不写文件"
              ;;
            push)
              args+=(--no-scaffold)
              echo "push 模式：只重建已有版本线"
              ;;
            schedule)
              echo "定时模式：允许自动升版与新增版本线"
              ;;
            workflow_dispatch)
              [ "${{ inputs.scaffold }}"  = "false" ] && args+=(--no-scaffold)  || true
              [ -n "${{ inputs.lines }}" ]    && args+=(--lines "${{ inputs.lines }}")       || true
              [ -n "${{ inputs.variants }}" ] && args+=(--variants "${{ inputs.variants }}") || true
              [ -n "${{ inputs.redis_version }}" ] && args+=(--force-version "${{ inputs.redis_version }}") || true
              echo "手动模式：${args[*]:-默认策略}"
              ;;
          esac

          # 空数组在 set -u 下的展开要加保护
          python3 scripts/ci_detect.py ${args[@]+"${args[@]}"} | tee /tmp/detect.log

          matrix="$(sed -n 's/^MATRIX=//p' /tmp/detect.log | tail -n1)"
          if [ -z "$matrix" ]; then
            echo "::error::未能从 detect 输出中解析出构建矩阵"
            exit 1
          fi
          count="$(printf '%s' "$matrix" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)["include"]))')"
          {
            echo "matrix=${matrix}"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"
          echo "构建矩阵：${count} 个镜像" >> "$GITHUB_STEP_SUMMARY"

      - name: 提交版本号与 README 更新
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(auto): 同步上游 Redis 版本并刷新 README" \
                     -m "由 .github/workflows/docker-publish.yml 的 detect 作业自动生成。"
          if git push; then
            echo "已提交并推送"
          else
            echo "::warning::提交推送失败（可能受分支保护限制），本次构建继续使用检测到的版本号"
          fi

  ############################################
  # 2. 构建：矩阵 = 版本线 × 变体
  ############################################
  build:
    name: "构建 ${{ matrix.line }}/${{ matrix.variant }} (${{ matrix.version }})"
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # 需要构建「全部安全支持期内」的版本线（约 9 条 × 2 变体），并发太低会跑几小时；
      # 4 路并行在 GitHub 免费额度（20 并发）内，且不会把上游下载打爆
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix).include }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU
        if: contains(env.PLATFORMS, 'arm')
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_to_registry)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算 tag
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "tag1=${IMAGE}:${{ matrix.line }}-${{ matrix.variant }}"
            echo "tag2=${IMAGE}:${{ matrix.version }}-${{ matrix.variant }}"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.line }}/${{ matrix.variant }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_to_registry) }}
          build-args: |
            REDIS_VERSION=${{ matrix.version }}
          tags: |
            ${{ steps.meta.outputs.tag1 }}
            ${{ steps.meta.outputs.tag2 }}
          cache-from: type=gha,scope=redis-${{ matrix.line }}-${{ matrix.variant }}
          cache-to: type=gha,scope=redis-${{ matrix.line }}-${{ matrix.variant }},mode=max

      - name: 输出摘要
        if: always()
        run: |
          {
            echo "### ${{ matrix.line }}/${{ matrix.variant }} (Redis ${{ matrix.version }})"
            echo "- LTS: ${{ matrix.lts }}"
            echo "- tags: \`${{ steps.meta.outputs.tag1 }}\`, \`${{ steps.meta.outputs.tag2 }}\`"
            echo "- context: \`${{ matrix.line }}/${{ matrix.variant }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ############################################
  # 3. 安全扫描（不阻断构建）
  ############################################
  scan:
    name: "扫描 ${{ matrix.line }}/${{ matrix.variant }}"
    needs: [detect, build]
    if: needs.detect.outputs.count != '0' && (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_to_registry))
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4

      - name: Trivy 扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-${{ matrix.variant }}
          format: 'sarif'
          output: 'trivy-${{ matrix.line }}-${{ matrix.variant }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: 上传 SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.line }}-${{ matrix.variant }}.sarif'
          category: 'redis-${{ matrix.line }}-${{ matrix.variant }}'

  ############################################
  # 4. 打 tag 时创建 Release
  ############################################
  release:
    name: 创建 Release
    needs: [detect, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总矩阵
        id: m
        run: |
          echo "matrix=${{ needs.detect.outputs.matrix }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Redis 镜像（UOS / Kylin V11）

            | 版本线 | 变体 | Redis 版本 |
            |--------|------|-----------|
            | 见下方矩阵 | uos / kylin | 见下方矩阵 |

            ```json
            ${{ needs.detect.outputs.matrix }}
            ```

            **拉取**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:<版本线>-<变体>
            ```
